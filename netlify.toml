[build]
  publish = "."

# ─── Cabeçalhos globais ─────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─── Cache longo para fontes ────────────────────────────
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache longo para assets ────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache moderado para CSS ────────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ─── PDFs servidos como download ────────────────────────
[[headers]]
  for = "/pdfs/*"
  [headers.values]
    Content-Disposition = "attachment"

# ─── Kit GM servido como download ───────────────────────
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"

# ─── URL amigável: nordflux.co/diagnostico ─────────────
[[redirects]]
  from = "/diagnostico"
  to = "/diagnostico.html"
  status = 200

# ─── Antiga página X360 fora do ar: redireciona para o diagnóstico ──
[[redirects]]
  from = "/360"
  to = "/diagnostico"
  status = 301

[[redirects]]
  from = "/x360"
  to = "/diagnostico"
  status = 301

[[redirects]]
  from = "/360.html"
  to = "/diagnostico"
  status = 301

# ─── URLs amigáveis: nordflux.co/gm e /gm/obrigado ─────
[[redirects]]
  from = "/gm"
  to = "/gm.html"
  status = 200

[[redirects]]
  from = "/gm/obrigado"
  to = "/gm-obrigado.html"
  status = 200

# ─── SPA-style fallback para a home ─────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
